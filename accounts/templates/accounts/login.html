{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="login-container">
    <h2>Sign In</h2>
    <p class="muted">State your CNIC using voice or enter it manually below.</p>

    <!-- Accessible Voice Authentication Control -->
    <div class="voice-login-section">
        <button type="button" id="record-btn" class="btn-voice">
            <span class="mic-icon">🎤</span> Hold Spacebar or Click to Speak
        </button>
        <p id="voice-status" class="status-indicator">Press spacebar or click the button to speak your 13-digit CNIC.</p>
    </div>

    <hr class="divider">

    <!-- Manual / Fallback Login Form -->
    <form id="login-form" method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <label for="cnic">CNIC Number
            <input 
                name="cnic" 
                id="cnic" 
                placeholder="13-digit CNIC without dashes" 
                type="text" 
                maxlength="13" 
                inputmode="numeric" 
                autofocus
            >
        </label>
        <button type="submit" id="submit-btn">Log In</button>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'accounts/js/login.js' %}"></script>
{% endblock %}
