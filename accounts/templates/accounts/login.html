{% extends 'base.html' %}
{% load static %}
{% block content %}
<h2>Sign In</h2>
<p class="muted">Enter your CNIC to Login.</p>
<form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <label>CNIC
        <input name="cnic" id="cnic" placeholder="xxxxxxxxxxxxx" type="text" required maxlength="13" inputmode="numeric" pattern="[0-9]{13}">
    </label>
    <button type="submit">Log In</button>
</form>
{% endblock %}

{% block extra_js %}
<script src="{% static 'accounts/js/login.js' %}"></script>
{% endblock %}

<script>
function speak(text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
}
window.addEventListener('load', function () {
    speak("Welcome to the voting system. Please type your 13 digit CNIC number.");
});
</script>
