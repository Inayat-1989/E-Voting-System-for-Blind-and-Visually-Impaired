{% extends 'base.html' %}
{% load static %}
{% block content %}
<h2>Sign In</h2>
<p class="muted">Enter your CNIC to Login.</p>
<form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <label>CNIC
        <input id="cnic" placeholder="xxxxxxxxxxxxx" type="text" name="cnic" required maxlength="13">
    </label>
    <button type="submit">Log In</button>
</form>
{% endblock %}

{% block extra_js %}
<script src="{% static 'accounts/js/login.js' %}"></script>
{% endblock %}
